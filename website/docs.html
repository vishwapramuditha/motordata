        const defaultData = {
            html: `<h2>Documentation Section Pending</h2>`,
            code: { javascript: '', python: '', shell: '' },
            title: 'API Document'
        };

        function switchTab(lang) {
            currentTab = lang;
            document.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.code-tab').forEach(t => {
                if (t.innerText === lang) t.classList.add('active');
            });
            renderCode();
        }

        function renderCode() {
            const data = docsData[currentContentKey] || defaultData;
            const codeEl = document.getElementById('codeContent');
            
            // Output template for specific endpoints to show terminal output visually
            const terminalOutput = `
                <div class="p-8 bg-[#020617] flex-grow">
                    <div class="text-xs font-bold text-gray-500 mb-4 uppercase tracking-wide">Terminal Output</div>
                    <pre class="font-mono text-sm leading-relaxed text-gray-300">[ { "id": "example", "name": "Data fetched successfully!" } ]</pre>
                </div>
            `;

            let codeHtml = data.code[currentTab] || '';
            // Append terminal block only to endpoints that actually fetch data
            if (['f1-drivers', 'motogp-riders', 'f1-results', 'wrc-drivers', 'indycar-drivers'].includes(currentContentKey)) {
                codeHtml += terminalOutput;
            }

            codeEl.style.opacity = 0;
            setTimeout(() => {
                codeEl.innerHTML = codeHtml;
                codeEl.style.opacity = 1;
            }, 100);
        }

        function loadContent(key) {
            currentContentKey = key;
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            const clicked = document.querySelector(`.sidebar-link[onclick="loadContent('${key}')"]`);
            if(clicked) clicked.classList.add('active');

            const data = docsData[key] || defaultData;
            document.getElementById('headerTitle').innerText = data.title;
            
            const mainEl = document.getElementById('mainContent');
            mainEl.style.opacity = 0;
            
            setTimeout(() => {
                mainEl.innerHTML = data.html;
                mainEl.style.opacity = 1;
                renderCode(); // render code based on currentTab
            }, 100);
        }

        loadContent('intro');
